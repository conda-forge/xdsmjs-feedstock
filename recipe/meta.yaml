{% set name = "xdsmjs" %}
{% set version = "2.1.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/xdsmjs-{{ version }}.tar.gz
  sha256: 55a0bb065496edfcf92fb751b33cdcbcbdf4d8237bdbe317b938f94d46be0746

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}

test:
  imports:
    - xdsmjs
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/OneraHub/XDSMjs
  summary: XDSMjs Python module
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - AntoineD
